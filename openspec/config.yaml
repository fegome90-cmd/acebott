# openspec/config.yaml
schema: spec-driven

context: |
  Hardware project: Acebott QD001 ESP32 MAX V1.0 (chip CH340/CH341 WCH).
  Tooling: arduino-cli 1.5.1 (brew), esptool bundled ACECode @ 115200 baud,
           uv + pyserial for monitor, pytest for host-side script tests,
           shellcheck for bash scripts.
  Harness: TypeScript (Node.js) at harness/ using Vitest and Biome lint/format.
  Sketches: C++ Arduino (~/Documents/Arduino/), built with FQBN esp32:esp32:esp32.
  Skill: acebott-esp32-flash (user-level, progressive disclosure).
  Tests are multi-layer: host-side Python (pytest), TypeScript harness (vitest),
  and hardware-validation (flash + boot verify) for firmware.

strict_tdd: true

testing:
  strict_tdd_mode: enabled
  detected: 2026-07-02
  note: |
    Adapted TDD: host-side scripts (python/bash helpers, flash automation)
    MUST use pytest/shellcheck before commit. TypeScript harness MUST use
    vitest. Firmware changes use a hardware-validation gate (compile -> flash
    -> serial monitor verify) instead of unit tests.
  test_runner:
    command: "uv run pytest (python), pnpm test (typescript)"
    framework: "pytest + vitest"
  test_layers:
    unit: AVAILABLE (pytest/vitest, host-side scripts & harness)
    integration: AVAILABLE (pytest/vitest + subprocess for arduino-cli/esptool)
    e2e: AVAILABLE (hardware flash + serial monitor — manual/semi-automated)
  coverage:
    available: true
    command: "uv run pytest --cov"
  quality_tools:
    linter: "ruff (python), shellcheck (bash), biome check (typescript)"
    type_checker: "tsc --noEmit (typescript), mypy (python, optional)"
    formatter: "ruff format (python), biome format (typescript)"


rules:
  proposal:
    - Include rollback plan for risky changes (firmware bricks hardware)
    - Identify affected modules (sketches, scripts, skill resources)
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document hardware pin mappings and electrical constraints
    - Include serial monitor expected output for validation flows
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing, validation)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Separate host-side (pytest) from firmware (hardware-validation) tasks
  apply:
    - Follow canonical flash workflow\n      (arduino-cli compile -> esptool bundled @ 115200)
    - Load acebott-esp32-flash skill before any firmware operation
    - Never use arduino-cli upload (forces 921600 baud, causes 0xE0)
  verify:
    - Host scripts: run pytest with coverage
    - Firmware: compile clean + flash + serial monitor confirms expected boot output
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
